# Perfil dedicado del contenedor Hermes. La lista explícita impide que el API server
# herede el conjunto completo de herramientas personales de Hermes.
platform_toolsets:
  api_server:
    - web
agent:
  disabled_toolsets:
    - terminal
    - file
    - memory
    - skills
    - cron
    - delegation
    - browser
    - computer_use
context:
  engine: compressor
# Control de consumo de tokens (Worki Cloud): cada página leída por la búsqueda web entra al
# contexto con 6.000 caracteres como máximo (Hermes trae 15.000) y la conversación se resume al
# pasar de 40.000 tokens, conservando los últimos 10 mensajes.
web:
  extract_char_limit: 6000
compression:
  enabled: true
  threshold_tokens: 40000
  protect_last_n: 10
